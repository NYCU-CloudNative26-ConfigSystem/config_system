apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${K8S_NAMESPACE}-ingress
  namespace: ${K8S_NAMESPACE}
  annotations:
    # Use GKE's native HTTP(S) Load Balancer (no extra controller needed)
    kubernetes.io/ingress.class: "gce"
spec:
  defaultBackend:
    service:
      name: service-frontendui
      port:
        number: 3000
  rules:
    - host: qube.fishyu.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000
    - http:
        paths:
          # All traffic goes to the Nuxt frontend, which proxies /api/* internally
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-frontendui
                port:
                  number: 3000
