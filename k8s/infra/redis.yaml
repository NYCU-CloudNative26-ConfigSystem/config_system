apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-standard-pd
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-standard
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# ── Redis ConfigMap (server configs) ──────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: ${K8S_NAMESPACE}
data:
  redis-primary.conf: |
    bind 0.0.0.0
    appendonly yes
    appendfsync everysec
  redis-replica.conf: |
    bind 0.0.0.0
    appendonly yes
    appendfsync everysec
    replicaof redis-0.redis-headless 6379
---
# ── Sentinel config template ──────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: ${K8S_NAMESPACE}
data:
  sentinel.conf: |
    port 26379
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor mymaster redis-0.redis-headless 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 30000
    sentinel parallel-syncs mymaster 1
---
# ── HAProxy scripts (init + sentinel watcher) ─────────────────────────────────
# Stored in a ConfigMap so envsubst never touches the shell variable syntax.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-haproxy-scripts
  namespace: ${K8S_NAMESPACE}
data:
  init.sh: |
    #!/bin/sh
    echo "Waiting for Sentinel to be ready..."
    until redis-cli -h redis-sentinel -p 26379 ping 2>/dev/null; do sleep 3; done
    RESULT=$(redis-cli -h redis-sentinel -p 26379 SENTINEL get-master-addr-by-name mymaster 2>/dev/null)
    MASTER_HOST=$(echo "$RESULT" | sed -n '1p')
    MASTER_PORT=$(echo "$RESULT" | sed -n '2p')
    MASTER_HOST=${MASTER_HOST:-redis-0.redis-headless}
    MASTER_PORT=${MASTER_PORT:-6379}
    echo "Initial primary: $MASTER_HOST:$MASTER_PORT"
    printf 'global\n  maxconn 4096\ndefaults\n  mode tcp\n  timeout connect 3s\n  timeout client 10s\n  timeout server 10s\nfrontend redis_front\n  bind *:6379\n  default_backend redis_back\nbackend redis_back\n  mode tcp\n  server master %s:%s check inter 3s\n' \
      "$MASTER_HOST" "$MASTER_PORT" > /live-config/haproxy.cfg
    echo "HAProxy config initialized."
  watch.sh: |
    #!/bin/sh
    LAST_MASTER=""
    while true; do
      sleep 5
      RESULT=$(redis-cli -h redis-sentinel -p 26379 SENTINEL get-master-addr-by-name mymaster 2>/dev/null)
      MASTER_HOST=$(echo "$RESULT" | sed -n '1p')
      MASTER_PORT=$(echo "$RESULT" | sed -n '2p')
      CURRENT="${MASTER_HOST}:${MASTER_PORT}"
      if [ -z "$MASTER_HOST" ] || [ "$CURRENT" = "$LAST_MASTER" ]; then continue; fi
      echo "Primary changed to $CURRENT, updating HAProxy..."
      printf 'global\n  maxconn 4096\ndefaults\n  mode tcp\n  timeout connect 3s\n  timeout client 10s\n  timeout server 10s\nfrontend redis_front\n  bind *:6379\n  default_backend redis_back\nbackend redis_back\n  mode tcp\n  server master %s:%s check inter 3s\n' \
        "$MASTER_HOST" "$MASTER_PORT" > /live-config/haproxy.cfg
      HAPROXY_PID=$(pgrep haproxy 2>/dev/null)
      if [ -n "$HAPROXY_PID" ]; then
        kill -HUP "$HAPROXY_PID" && echo "HAProxy reloaded (PID $HAPROXY_PID)"
      fi
      LAST_MASTER="$CURRENT"
    done
---
# ── Redis StatefulSet (1 primary + 2 replicas) ────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ${K8S_NAMESPACE}
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      initContainers:
        - name: redis-init
          image: redis:7-alpine
          command:
            - /bin/sh
            - -c
            - |
              case $(hostname) in
                *-0) cp /config/redis-primary.conf /data/redis.conf ;;
                *)   cp /config/redis-replica.conf /data/redis.conf ;;
              esac
          volumeMounts:
            - name: redis-config
              mountPath: /config
            - name: data
              mountPath: /data
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "/data/redis.conf"]
          ports:
            - {containerPort: 6379}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap: {name: redis-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: redis-standard-pd
        resources:
          requests: {storage: 1Gi}
---
# ── Redis Headless Service (stable DNS per pod) ───────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: ${K8S_NAMESPACE}
spec:
  clusterIP: None
  selector: {app: redis}
  ports:
    - {port: 6379}
---
# ── Redis Sentinel StatefulSet (3 pods — quorum 2) ───────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: ${K8S_NAMESPACE}
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  selector:
    matchLabels: {app: redis-sentinel}
  template:
    metadata:
      labels: {app: redis-sentinel}
    spec:
      initContainers:
        - name: sentinel-init
          image: redis:7-alpine
          command:
            - /bin/sh
            - -c
            - |
              cp /config-template/sentinel.conf /data/sentinel.conf
              echo "sentinel announce-hostname $(hostname).redis-sentinel-headless" >> /data/sentinel.conf
              echo "Waiting for redis-0 to be ready..."
              until redis-cli -h redis-0.redis-headless -p 6379 ping 2>/dev/null; do sleep 2; done
              echo "redis-0 is ready."
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: data
              mountPath: /data
      containers:
        - name: sentinel
          image: redis:7-alpine
          command: ["redis-sentinel", "/data/sentinel.conf"]
          ports:
            - {containerPort: 26379}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "64Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: config-template
          configMap: {name: redis-sentinel-config}
        - name: data
          emptyDir: {}
---
# ── Sentinel Headless Service (stable pod DNS) ────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  namespace: ${K8S_NAMESPACE}
spec:
  clusterIP: None
  selector: {app: redis-sentinel}
  ports:
    - {port: 26379}
---
# ── Sentinel ClusterIP Service (what HAProxy queries) ────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: ${K8S_NAMESPACE}
spec:
  selector: {app: redis-sentinel}
  ports:
    - {port: 26379, targetPort: 26379}
---
# ── HAProxy Deployment (Sentinel-aware — auto-follows primary on failover) ────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-haproxy
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis-haproxy}
  template:
    metadata:
      labels: {app: redis-haproxy}
    spec:
      shareProcessNamespace: true   # lets the watcher sidecar signal HAProxy
      initContainers:
        - name: haproxy-init
          image: redis:7-alpine
          command: ["/bin/sh", "/scripts/init.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: live-config
              mountPath: /live-config
      containers:
        - name: haproxy
          image: haproxy:2.8-alpine
          ports:
            - {containerPort: 6379}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "64Mi"
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: live-config
              mountPath: /usr/local/etc/haproxy
        - name: sentinel-watcher
          image: redis:7-alpine
          command: ["/bin/sh", "/scripts/watch.sh"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "32Mi"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: live-config
              mountPath: /live-config
      volumes:
        - name: scripts
          configMap:
            name: redis-haproxy-scripts
            defaultMode: 0755
        - name: live-config
          emptyDir: {}
---
# ── Redis Service (apps connect here → HAProxy → current primary) ──────────────
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ${K8S_NAMESPACE}
spec:
  selector: {app: redis-haproxy}
  ports:
    - {port: 6379, targetPort: 6379}
