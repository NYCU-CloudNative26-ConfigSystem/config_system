name: Formatting Check

on:
  push:
    branches: [main, dev]
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/format.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/format.yml'

jobs:
  python-format:
    name: Python · Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install black==24.10.0
      - run: |
          files=$(find . -type f -name "*.py" 2>/dev/null)
          if [ -n "$files" ]; then
            black --check $files
          else
            echo "No Python files to format"
          fi

  ts-format:
    name: TypeScript · Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global prettier@3.3.3
      - run: |
          files=$(find . -type f \( -name "*.ts" -o -name "*.tsx" \) 2>/dev/null)
          if [ -n "$files" ]; then
            npx prettier --check $files
          else
            echo "No TypeScript files to format"
          fi
