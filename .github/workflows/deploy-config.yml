name: Deploy Config to Dummy App

on:
  repository_dispatch:
    types: [deploy-config]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: us-east1
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Decode and apply config files
        run: |
          echo '${{ github.event.client_payload.file_b64 }}' | base64 -d > /tmp/config_file
          echo '${{ github.event.client_payload.meta_b64 }}' | base64 -d > /tmp/meta.json
          kubectl create configmap dummy-app-config \
            --from-file=config_file=/tmp/config_file \
            --from-file=meta.json=/tmp/meta.json \
            --dry-run=client -o yaml \
            | kubectl apply -f - -n config-system

      - name: Restart dummy app
        run: kubectl rollout restart deployment/dummy-app -n config-system

      - name: Wait for rollout
        run: kubectl rollout status deployment/dummy-app -n config-system --timeout=120s
