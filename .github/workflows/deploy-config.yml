name: Deploy Config to Dummy App

on:
  repository_dispatch:
    types: [deploy-config]

env:
  GKE_CLUSTER: config-system
  GKE_REGION: us-east1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}

      - name: Set up gcloud + kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GKE_REGION }} --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Decode and apply config files
        run: |
          NAMESPACE="${{ github.event.client_payload.namespace }}"
          printf '%s' '${{ github.event.client_payload.file_b64 }}' | base64 -d > /tmp/config_file
          printf '%s' '${{ github.event.client_payload.meta_b64 }}' | base64 -d > /tmp/meta.json
          kubectl create configmap dummy-app-config \
            --from-file=config_file=/tmp/config_file \
            --from-file=meta.json=/tmp/meta.json \
            --dry-run=client -o yaml \
            | kubectl apply -f - -n "$NAMESPACE"

      - name: Restart dummy app
        run: kubectl rollout restart deployment/dummy-app -n "${{ github.event.client_payload.namespace }}"

      - name: Wait for rollout
        run: kubectl rollout status deployment/dummy-app -n "${{ github.event.client_payload.namespace }}" --timeout=120s
